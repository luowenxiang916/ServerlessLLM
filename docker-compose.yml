services:
  # ---------- Head Node（不占 GPU）----------
  sllm_head:
    build:
      context: .
      dockerfile: Dockerfile
    image: serverlessllm/sllm:5090
    container_name: sllm_head
    environment:
      - MODEL_FOLDER=${MODEL_FOLDER}
      - MODE=HEAD
    ports:
      - "6379:6379"    # Redis
      - "8343:8343"    # ServerlessLLM API
    networks:
      - sllm_network
    command: []

  # ---------- Worker Node 4 → GPU 4 ----------
  sllm_worker_4:
    build: { context: ., dockerfile: Dockerfile }
    image: serverlessllm/sllm:5090
    container_name: sllm_worker_4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ["gpu"]
              device_ids: ["4"]
    environment: [WORKER_ID=4, STORAGE_PATH=/models, MODE=WORKER]
    networks: [sllm_network]
    volumes:
      - ${MODEL_FOLDER}:/models
    command: ["--mem-pool-size", "8GB"]

  # ---------- Worker Node 5 → GPU 5 ----------
  sllm_worker_5:
    build: { context: ., dockerfile: Dockerfile }
    image: serverlessllm/sllm:5090
    container_name: sllm_worker_5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ["gpu"]
              device_ids: ["5"]
    environment: [WORKER_ID=5, STORAGE_PATH=/models, MODE=WORKER]
    networks: [sllm_network]
    volumes:
      - ${MODEL_FOLDER}:/models
    command: ["--mem-pool-size", "8GB"]

  # ---------- Worker Node 6 → GPU 6 ----------
  sllm_worker_6:
    build: { context: ., dockerfile: Dockerfile }
    image: serverlessllm/sllm:5090
    container_name: sllm_worker_6
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ["gpu"]
              device_ids: ["6"]
    environment: [WORKER_ID=6, STORAGE_PATH=/models, MODE=WORKER]
    networks: [sllm_network]
    volumes:
      - ${MODEL_FOLDER}:/models
    command: ["--mem-pool-size", "8GB"]

  # ---------- Worker Node 7 → GPU 7 ----------
  sllm_worker_7:
    build: { context: ., dockerfile: Dockerfile }
    image: serverlessllm/sllm:5090
    container_name: sllm_worker_7
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ["gpu"]
              device_ids: ["7"]
    environment: [WORKER_ID=7, STORAGE_PATH=/models, MODE=WORKER]
    networks: [sllm_network]
    volumes:
      - ${MODEL_FOLDER}:/models
    command: ["--mem-pool-size", "8GB"]

networks:
  sllm_network:
    driver: bridge
    name: sllm